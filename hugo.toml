baseURL = "https://masrur-siam.github.io/"
title = "Masrur Hossain Siam | Software Developer"
theme = "hugo-profile"

[params]
    # --- Site Branding ---
    title = "Masrur Siam"
    name = "Masrur Hossain Siam"
    description = "Building Scalable SaaS, Mobile Apps, and AI Workflows."
    favicon = "images/avatar.jpg"
    
    # --- Global Configuration ---
    disableThemeCredit = true
    disablePageInfo = true
    disableReadingTime = true
    themeMode = "dark" 
    customCSS = ["css/custom.css"]

    # --- Hero Section ---
    [params.hero]
        enable = true
        title = "Hi, I am Masrur Hossain Siam"
        subtitle = "Android & SaaS Expert | Prompt Engineer"
        content = "Architecting high-performance mobile ecosystems and complex AI-driven SaaS workflows. Focused on bridging technical innovation with real-world usability."
        image = "images/avatar.jpg"
        imageFixed = true 
        [params.hero.btn]
            enable = true
            name = "View Projects"
            link = "/projects"

    # --- About Section ---
    [params.about]
        enable = true
        title = "About Me"
        content = "Passionate and self motivated learner with interests in web development, software technology, and digital media. Quick to adapt to new challenges and always eager to improve skills through practical projects and continuous learning."

    # --- Contact Details (Used in Contact Section) ---
    email = "seaimmolla@gmail.com"
    location = "Narayanganj, Bangladesh"
    phone = "+8801812497901"

    # --- Footer & Social Settings (ERROR FIX) ---
    # Structure must exactly match the theme's expectation to avoid 'Nil pointer'
    [params.footer]
        enable = true
        showCopyright = true
        showSocialNetworks = true
        [params.footer.socialNetworks]
            github = "https://github.com/masrur-siam"
            linkedin = "https://linkedin.com/in/masrur-siam"
            # Onyo social link thakle eivhabe add korte paren

# --- Projects Section ---
[params.projects]
    enable = true
    title = "Featured Projects"
    maxProjects = 3
    showMore = true

# --- Certifications ---
[[params.certificates]]
    name = "Web Development Fundamentals"
    outline = "HTML & CSS"
    icon = "code"
[[params.certificates]]
    name = "Digital Marketing Essentials"
    outline = "10 Minute School"
    icon = "chart-line"

# --- Navbar Menus (Ultra Clean) ---
[[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
[[menu.main]]
    name = "Projects"
    url = "/projects"
    weight = 2
[[menu.main]]
    name = "Resume"
    url = "/resume"
    weight = 3
[[menu.main]]
    name = "Contact"
    url = "/contact" # Direct page link
    weight = 4

# --- Home Page Sections ---
[params.sections]
    hero = true
    about = true
    projects = true
    certificates = true
    skills = true
    contact = true

[outputs]
    home = ["HTML", "RSS", "JSON"]

    [markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true