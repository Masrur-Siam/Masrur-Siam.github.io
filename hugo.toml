baseURL = "https://masrur-siam.github.io/"
title = "Masrur Hossain Siam | Software Developer"
theme = "hugo-profile"

[params]
    # --- Site Branding ---
    title = "Masrur Siam"
    name = "Masrur Hossain Siam"
    description = "Building Scalable SaaS, Mobile Apps, and AI Workflows."
    favicon = "images/avatar.jpg"
    
    # --- Global Configuration ---
    disableThemeCredit = true
    disablePageInfo = true
    disableReadingTime = true
    themeMode = "dark" 
    customCSS = ["css/custom.css"]

    # ==========================================
# HERO SECTION UPDATES
# ==========================================
[params.hero]
  enable = true
  title = "Hi, I am Masrur Hossain Siam"
  subtitle = "Full Stack Developer | Software Engineer | SaaS & Mobile App Developer"
  typewriter = [
    "Full Stack Software Engineer",
    "SaaS Architecture & Web Specialist",
    "Native Android App Developer",
    "Prompt Engineering & AI Automation"
  ]
  description = "Versatile, product-minded Software Engineer specializing in building scalable full-stack web platforms, multi-tenant SaaS applications, and native Android applications with AI-driven workflows."
  image = "/images/avatar.jpg" # আপনার ছবির সঠিক পাঠ বা ফাইল নাম দিন

    # ==========================================
# ABOUT ME SECTION UPDATES
# ==========================================
[params.about]
  enable = true
  title = "About Me"
  content = "Versatile and product-minded Software Engineer with strong hands-on experience in building full-stack web platforms, multi-tenant SaaS architectures, and native Android applications. Proficient in designing end-to-end system architectures, building secure REST APIs, automated background tasks, and SQL databases. Highly skilled in leverage-based AI workflow automation, advanced prompt engineering, and modern UI/UX design."

    # --- Contact Details (Used in Contact Section) ---
    email = "seaimmolla@gmail.com"
    location = "Narayanganj, Bangladesh"
    phone = "+8801812497901"

    # --- Footer & Social Settings (ERROR FIX) ---
    # Structure must exactly match the theme's expectation to avoid 'Nil pointer'
    [params.footer]
        enable = true
        showCopyright = true
        showSocialNetworks = true
        [params.footer.socialNetworks]
            github = "https://github.com/masrur-siam"
            linkedin = "https://linkedin.com/in/masrur-siam"
            # Onyo social link thakle eivhabe add korte paren

# --- Projects Section ---
[params.projects]
    enable = true
    title = "Featured Projects"
    maxProjects = 3
    showMore = true

# --- Certifications ---
[[params.certificates]]
    name = "Web Development Fundamentals"
    outline = "HTML & CSS"
    icon = "code"
[[params.certificates]]
    name = "Digital Marketing Essentials"
    outline = "10 Minute School"
    icon = "chart-line"

# --- Navbar Menus (Ultra Clean) ---
[[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
[[menu.main]]
    name = "Projects"
    url = "/projects"
    weight = 2
[[menu.main]]
    name = "Resume"
    url = "/resume"
    weight = 3
[[menu.main]]
    name = "Contact"
    url = "/contact" # Direct page link
    weight = 4

# --- Home Page Sections ---
[params.sections]
    hero = true
    about = true
    projects = true
    certificates = true
    skills = true
    contact = true

[outputs]
    home = ["HTML", "RSS", "JSON"]

    [markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true